services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27018:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - '4001:4001'
    environment:
      PORT: '4001'
      MONGODB_URI: mongodb://mongo:27017/bab_cms
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-bab-cms}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3003}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@bab.com.sa}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
    volumes:
      - uploads:/app/frontend/public/uploads
      - cv_uploads:/app/backend/uploads/cvs
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4001}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://bab.com.sa}
        INDEXNOW_KEY: ${INDEXNOW_KEY:-}
    restart: unless-stopped
    ports:
      - '3003:3000'
    environment:
      API_URL: http://backend:4001
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4001}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://bab.com.sa}
      INDEXNOW_KEY: ${INDEXNOW_KEY:-}
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      - backend

  seed:
    profiles: ['seed']
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      MONGODB_URI: mongodb://mongo:27017/bab_cms
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-bab-cms}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3003}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@bab.com.sa}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
    volumes:
      - uploads:/app/frontend/public/uploads
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ['npx', 'tsx', 'src/seed.ts']
    restart: 'no'

volumes:
  mongo_data:
  redis_data:
  uploads:
  cv_uploads:
