services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27018:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - '4001:4001'
    environment:
      PORT: '4001'
      MONGODB_URI: mongodb://mongo:27017/bab_cms
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env — 24+ characters}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3003}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@bab.com.sa}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env — 12+ characters}
      INQUIRY_NOTIFY_TO: ${INQUIRY_NOTIFY_TO:-sales@bab.com.sa}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@bab.com.sa}
    volumes:
      - uploads:/app/frontend/public/uploads
      - cv_uploads:/app/backend/uploads/cvs
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4001/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4001}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3003}
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
        INDEXNOW_KEY: ${INDEXNOW_KEY:-a0d1d00c073c48c2b85694d1a36ccfbf}
        BING_SITE_AUTH_CODE: ${BING_SITE_AUTH_CODE:-}
        GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-googled43fdb9897d9f8a7}
    restart: unless-stopped
    ports:
      - '3003:3000'
    environment:
      API_URL: http://backend:4001
      SITE_URL: ${SITE_URL:-}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4001}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3003}
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
      INDEXNOW_KEY: ${INDEXNOW_KEY:-a0d1d00c073c48c2b85694d1a36ccfbf}
      BING_SITE_AUTH_CODE: ${BING_SITE_AUTH_CODE:-}
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-googled43fdb9897d9f8a7}
      GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID:-G-BCLTJXVS8F}
      GA_LEAD_CURRENCY: ${GA_LEAD_CURRENCY:-SAR}
      GA_LEAD_VALUE: ${GA_LEAD_VALUE:-1}
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      - backend

  seed:
    profiles: ['seed']
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      MONGODB_URI: mongodb://mongo:27017/bab_cms
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env — 24+ characters}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3003}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@bab.com.sa}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env — 12+ characters}
    volumes:
      - uploads:/app/frontend/public/uploads
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ['npx', 'tsx', 'src/seed.ts']
    restart: 'no'

volumes:
  mongo_data:
  redis_data:
  uploads:
  cv_uploads:
